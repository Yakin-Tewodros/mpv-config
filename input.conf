# Keyboard
q stop
\ playlist-prev

# Scrolling
WHEEL_UP 	add volume -2
WHEEL_DOWN 	add volume 2
WHEEL_LEFT	add volume 2
WHEEL_RIGHT	add volume -2

# Go to beginning
Home no-osd seek 0 absolute ; show-text "Seek to the beginning" 2000 ; set pause no

# Loop playlist
ctrl+l cycle-values loop-playlist yes no ; show-text "${?=loop-playlist==inf:Loop current playlist: inf}${?=loop-playlist==no:Loop current playlist: no}"

# Audio balance for broken earpods
KP7 cycle_values af "lavfi=[pan=stereo|c0=c0|c1=2.2*c1]" "" 

